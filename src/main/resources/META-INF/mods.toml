modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/satan007/lootoverflow/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "${forge_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Soft dependency: if Lootr is installed, we intentionally hand its chests
# off to its own per-player loot system instead of touching them ourselves.
[[dependencies.${mod_id}]]
    modId = "lootr"
    mandatory = false
    versionRange = "[0,)"
    ordering = "NONE"
    side = "BOTH"
